# Local development with hot reload (bind mount + named volume for node_modules)

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - dev_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      DIRECTUS_URL: ${DIRECTUS_URL:-}
      NEXT_PUBLIC_DIRECTUS_URL: ${NEXT_PUBLIC_DIRECTUS_URL:-}
    stdin_open: true
    tty: true

volumes:
  dev_node_modules:
