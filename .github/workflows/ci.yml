name: CI

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Optional repo variables; when unset, lib/site.ts and lib/directus-env.ts defaults apply.
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          DIRECTUS_URL: ${{ vars.DIRECTUS_URL }}
          NEXT_PUBLIC_DIRECTUS_URL: ${{ vars.NEXT_PUBLIC_DIRECTUS_URL }}
